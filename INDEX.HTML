<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Weather API</title>
  </head>
  <body>
    <div class="app-container">
     <div class="container">
      <div class="search-box">
        <input id="cityInput" type="text" placeholder="Enter City" />
        <button id="searchBtn">
          <i class="fa fa-magnifying-glass"></i>
        </button>
      </div>

      <div class="weather-info">
        
        <div class="info-box">
          <i class="fa-solid fa-temperature-half">
            <span id="temp"></span>
          </i>
        </div>
         <div class="info-box">
          <i class="fa-solid fa-arrow-up">
            <span id="tempMax"></span>
          </i>
        </div>
        <div class="info-box">
          <i class="fa-solid fa-arrow-down">
            <span id="tempMin"></span>
          </i>
        </div>
         <div class="info-box">
          <i class="fa-solid fa-wind">
            <span id="windspeed"></span>
          </i>
        </div>
         <div class="info-box">
          <i class="fa-solid fa-calendar-days"></i>
            <span id="date"></span>
          
        </div>
        <img id="weather-icon" src="telescope.png" />
      </div>
    </div>
 <body class="light-mode">
        <label class="switch">
          <input type="checkbox" id="themeToggle">
          <span class="slider">
            <span class="knob"></span>
          </span>
        </label>

  <div class="forecast-container">
    <div class="forecast-card">
      <h3>Mon</h3>
      <img src="sun.png">
      <p>28°C</p>
    </div>

    <div class="forecast-card">
      <h3>Tue</h3>
      <img src="cloud.png">
      <p>24°C</p>
    </div>
    
    <div class="forecast-card">
      <h3>Wed</h3>
      <img src="rain.png">
      <p>20°C</p>
    </div>

    <div class="forecast-card">
      <h3>Thur</h3>
      <img src="sun.png">
      <p>30°C</p>
    </div>
    <div class="forecast-card">
      <h3>Fri</h3>
      <img src="cloud.png">
      <p>18°C</p>
    </div>

  </div>

  </div>
    <script src="MAIN.JS"></script>
  </body>
</html>

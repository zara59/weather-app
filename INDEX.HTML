<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
    <title>WeatherApp</title>
  </head>
  <body>
    <div class="background">
      <div class="overlay">
        <div id="popup" class="popup">
          <div class="popup-box">
            <h2>what's your city?</h2>
            <input type="text" id="popupInput" placeholder="Enter city..." />

            <div class="popup-actions">
              <div class="divider"></div>
              <button id="continueBtn">Continue</button>
              <div class="divider"></div>
              <button
                id="exitBtn"
                onclick="
                  document.getElementById('popup').style.display = 'none'
                "
              >
                Exit
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="app hidden" id="app">
        <div class="container">
          <input id="cityInput" type="text" placeholder="Enter city" />
          <button id="searchBtn">
            <i class="fa fa-magnifying-glass"></i>
          </button>

          <div class="weather-info">
            <h1 class="cityName"></h1>
            <h1 id="temp"></h1>
            <h2 id="condition"></h2>
            <p id="feelsLike"></p>
            <div id="date"></div>
            <img id="weather-icon" alt="" />
          </div>

          <div class="details">
            <div class="detail-box">
              <i class="fa-solid fa-droplet"></i>
              <p>Humidity</p>
              <span id="humidity"></span>
            </div>

            <div class="detail-box">
              <i class="fa-solid fa-wind"></i>
              <p>windSpeed</p>
              <span id="windSpeed"></span>
            </div>

            <div class="detail-box">
              <i class="fa-solid fa-gauge"></i>
              <p>Pressure</p>
              <span id="pressure"></span>
            </div>

            <div class="detail-box">
              <i class="fa-solid fa-eye"></i>
              <p>Visibility</p>
              <span id="visibility"></span>
            </div>
          </div>
        </div>

        <div class="forecast-container">
          <div class="forecast-card">
            <p id="forecast-day">Mon</p>
            <img src="" alt="" />
            <p id="forecast-temp"></p>
          </div>

          <div class="forecast-card">
            <p id="forecast-day">Tue</p>
            <img src="" alt="" />
            <p id="forecast-temp"></p>
          </div>

          <div class="forecast-card">
            <p id="forecast-day">Wed</p>
            <img src="" alt="" />
            <p id="forecast-temp"></p>
          </div>

          <div class="forecast-card">
            <p id="forecast-day">Thur</p>
            <img src="" alt="" />
            <p id="forecast-temp"></p>
          </div>

          <div class="forecast-card">
            <p id="forecast-day">Fri</p>
            <img src="" alt="" />
            <p id="forecast-temp"></p>
          </div>

          <div class="forecast-card">
            <p id="forecast-day">Sat</p>
            <img src="" alt="" />
            <p id="forecast-temp"></p>
          </div>

          <div class="forecast-card">
            <p id="forecast-day">Sun</p>
            <img src="" alt="" />
            <p id="forecast-temp"></p>
          </div>
        </div>

        <label class="switch">
          <input type="checkbox" id="darkToggle" />
          <span class="slider">
            <span class="knob"></span>
          </span>
        </label>
      </div>
    </div>

    <script src="MAIN.JS"></script>
  </body>
</html>
